name: Compilar Lampiao CS4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q lampiao-cs4-do-zero.zip -d projeto

      - name: Encontrar projeto
        run: |
          find projeto -name build.gradle -type f

      - name: Compilar
        run: |
          cd projeto/lampiao-cs4
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Gerar download
        uses: actions/upload-artifact@v4
        with:
          name: lampiao-cs4
          path: projeto/lampiao-cs4/build/libs/*.jar
